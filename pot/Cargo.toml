[package]
name = "pot"
version = "0.1.0"
authors = ["Benjamin Klum <benjamin.klum@helgoboss.org>"]
edition = "2021"
publish = false

[dependencies]
# Own
base.workspace = true
pot-db.workspace = true
reaper-high.workspace = true
reaper-medium.workspace = true
helgobox-api.workspace = true
rppxml-parser.workspace = true

# 3rd-party
enumset.workspace = true
itertools.workspace = true
wildmatch.workspace = true
serde.workspace = true
derive_more.workspace = true
tokio.workspace = true
enum-map.workspace = true
once_cell.workspace = true
lexical-sort.workspace = true
strum.workspace = true
splitty.workspace = true
rust-ini.workspace = true
walkdir.workspace = true
either.workspace = true
riff-io.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
lofty.workspace = true
# For detecting the appearance of plug-in "Save Preset As" dialogs (preset crawler)
xcap.workspace = true
# For reading the preset name that the crawler copies out of "Save Preset As" dialogs
arboard.workspace = true
# For the save-as action recorder: polling global mouse/keyboard during recording
# (device_query) and replaying physical keys layout-independently (enigo Key::Raw).
device_query.workspace = true
enigo.workspace = true
rmp-serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
futures.workspace = true
derivative.workspace = true
tempfile.workspace = true
sanitize-filename.workspace = true
tracing.workspace = true
regex.workspace = true
nanoid.workspace = true
chrono.workspace = true
anyhow.workspace = true
camino.workspace = true

[lints.clippy]
enum_glob_use = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
# Posting mouse clicks with the multi-click "click state" macOS needs to recognize
# double/triple-clicks (enigo always posts click-state 1). Used by the save-as macro
# replay so a recorded triple-click selects text in native dialogs.
core-graphics = "0.24"